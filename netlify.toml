[build]
  base = "cake-shop-frontend-v2"
  publish = "build"
  command = "npm run build"

  [build.environment]
    REACT_APP_BACKEND_URL = "https://cube-cake-deploy-ft08.onrender.com"
    REACT_APP_API_URL = "https://cube-cake-deploy-ft08.onrender.com/api"

[dev]
  command = "npm start"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200